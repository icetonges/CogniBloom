name: Soccer Calendar Sync

on:
  schedule:
    # Four times a day — PlayMetrics is the source of truth for practice/game
    # times and venues, and coaches sometimes move things around during the
    # week. 08:00 UTC / 14:00 UTC / 20:00 UTC / 02:00 UTC covers morning
    # through late evening in Eastern time either way the clock falls.
    - cron: '0 8,14,20,2 * * *'

  # Manual trigger, e.g. right after the team publishes a schedule change.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull PlayMetrics calendar
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      APP_URL: https://cognibloom.vercel.app

    steps:
      - name: Sync soccer calendar
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "$APP_URL/api/soccer/sync" \
            -H "x-cron-secret: ${CRON_SECRET}")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Soccer sync failed with status $HTTP_STATUS"
            case "$BODY" in
              *SOCCER_ICS_URL*)
                echo "::error::SOCCER_ICS_URL is not set on the deployment. Add the team's PlayMetrics .ics link in Vercel → cogni-bloom → Settings → Environment Variables (Production + Preview + Development), then redeploy — env vars only apply to new builds." ;;
              *"does not exist"*|*migration*)
                echo "::error::The SoccerEvent table is missing. Run 'pnpm db:migrate' (prisma migrate deploy) against the production database — never 'prisma migrate dev'." ;;
              *Forbidden*)
                echo "::error::CRON_SECRET in this repository's secrets does not match the deployment's CRON_SECRET env var." ;;
              *)
                echo "::error::Unexpected sync failure. See the response body above." ;;
            esac
            exit 1
          fi
          echo "✅ Soccer calendar synced"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Soccer calendar sync failed. Check logs above."
          echo "Ensure CRON_SECRET and SOCCER_ICS_URL are set (repository secret / Vercel env var, respectively)."
